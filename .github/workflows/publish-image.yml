# Builds the Docker image and publishes it to the GitHub Container Registry
# (ghcr.io/jackharris2215/squire) for amd64 and arm64.
#
# To release: git tag v1.0.0 && git push origin v1.0.0
#   -> tags the image 1.0.0, 1.0 and latest.
# It can also be run by hand from the repo's Actions tab (tags the image with the branch name).
#
# After the first publish, open the package on GitHub (your profile > Packages > squire >
# Package settings) and set its visibility to Public, or people can't pull it without logging in.
name: Publish Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lets the amd64 runner build the arm64 image too (Raspberry Pi, Apple Silicon).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
